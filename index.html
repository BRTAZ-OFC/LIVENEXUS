<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live Nexus Connect" />
    <title>Live Nexus Connect</title>
    <script>
      window.__LIVENEXUS_ERRORS__ = window.__LIVENEXUS_ERRORS__ || [];
      function __renderFallbackStripe(item) {
        if (document.getElementById("livenexus-react-error-viewer")) return;
        var el = document.getElementById("livenexus-native-error-stripe");
        if (!el) {
          el = document.createElement("div");
          el.id = "livenexus-native-error-stripe";
          el.style.cssText =
            "position:fixed;top:0;left:0;bottom:0;width:420px;max-width:94vw;background:#140204;color:#fee2e2;border-right:4px solid #dc2626;z-index:999999;box-shadow:12px 0 35px rgba(220,38,38,0.35);font-family:monospace;padding:16px;overflow-y:auto;box-sizing:border-box;";
          if (document.body) {
            document.body.appendChild(el);
          } else {
            window.addEventListener("DOMContentLoaded", function () {
              document.body.appendChild(el);
            });
          }
        }
        el.innerHTML =
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;"><span style="background:#dc2626;color:#fff;padding:2px 8px;border-radius:4px;font-weight:bold;font-size:11px;">' +
          (item.type || "ERRO TÉCNICO") +
          '</span><span style="font-size:11px;color:#fca5a5;">' +
          item.timestamp +
          "</span></div>" +
          '<div style="font-weight:bold;color:#fecaca;font-size:13px;margin-bottom:8px;word-break:break-all;">' +
          item.name +
          ": " +
          item.message +
          "</div>" +
          (item.filename
            ? '<div style="font-size:11px;color:#f87171;margin-bottom:8px;word-break:break-all;">Arquivo: ' +
              item.filename +
              (item.lineno ? " (Linha " + item.lineno + ":" + (item.colno || 0) + ")" : "") +
              "</div>"
            : "") +
          (item.stack
            ? '<pre style="background:#070102;color:#fca5a5;padding:10px;border-radius:6px;font-size:11px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;border:1px solid #7f1d1d;max-height:350px;">' +
              item.stack +
              "</pre>"
            : "");
      }

      window.addEventListener("error", function (e) {
        var err = e.error || e;
        var item = {
          id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
          name: (err && err.name) || "Error",
          message: (err && err.message) || e.message || String(e),
          filename: e.filename || "",
          lineno: e.lineno,
          colno: e.colno,
          stack: (err && err.stack) || "",
          type: "Erro de Execução (Runtime)",
          timestamp: new Date().toLocaleTimeString("pt-BR"),
        };
        window.__LIVENEXUS_ERRORS__.push(item);
        window.dispatchEvent(new CustomEvent("livenexus:error", { detail: item }));
        __renderFallbackStripe(item);
      });
      window.addEventListener("unhandledrejection", function (ev) {
        var r = ev.reason;
        var item = {
          id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
          name: (r && r.name) || "UnhandledRejection",
          message: (r && r.message) || String(r || "Promise Rejection"),
          stack: (r && r.stack) || "",
          type: "Promise Rejeitada (Unhandled)",
          timestamp: new Date().toLocaleTimeString("pt-BR"),
        };
        window.__LIVENEXUS_ERRORS__.push(item);
        window.dispatchEvent(new CustomEvent("livenexus:error", { detail: item }));
        __renderFallbackStripe(item);
      });
    </script>
  </head>
  <body class="app-body">
    <div id="root"></div>
    <script type="module" src="/dashboard/main.tsx"></script>
  </body>
</html>
